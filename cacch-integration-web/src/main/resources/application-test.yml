# ==================== 测试环境配置 ====================
# 角色：仅 API。定时任务由正式环境（app.role=all）执行，避免与正式抢跑同一套企微。
# 联调同步请调用 /api/v1/meeting/sync/* 手动触发。

app:
  role: api

spring:
  # ---------- PostgreSQL 数据源（与 prod 共用同一库 cdb；密码经环境变量 DB_PASSWORD 注入） ----------
  datasource:
    url: jdbc:postgresql://10.80.86.93:5432/cdb
    username: ${DB_USERNAME:esb}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  # ---------- Redis 配置 ----------
  data:
    redis:
      host: 10.80.86.95
      port: 6379
      # 密码经环境变量 REDIS_PASSWORD 注入
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          # 最大活跃连接数
          max-active: 8
          # 最大空闲连接数
          max-idle: 8
          # 最小空闲连接数（0 表示不预创建）
          min-idle: 0

  # ---------- Flyway 数据库迁移（test/prod 共用同一库，仅 test 启动时执行） ----------
  flyway:
    enabled: true
    # 已有表结构的数据库首次接入 Flyway 时自动 baseline，再执行未运行的脚本
    baseline-on-migrate: true
    # 禁止 clean（共用库，防止误删数据）
    clean-disabled: true

# ---------- MyBatis-Plus 测试环境：SQL 日志走 SLF4J（级别见 logback-spring.xml test profile） ----------

# ---------- 服务端口 ----------
server:
  # 测试环境使用 8081，避免与生产 8080 冲突
  port: 8081

# ---------- Actuator 健康监控 ----------
# ---------- 企业微信多应用配置 ----------
wecom:
  apps:
    # 泰禾 — 自建应用（智能表格等文档 API 使用此配置鉴权）；secret 经 WECOM_SELF_BUILT_SECRET 注入
    # 注意：环境变量名严禁使用 WECOM_APPS_N_SECRET 形式 —— 会被 Spring 映射为 wecom.apps[N].secret，
    # 导致 List 绑定整体从 SystemEnvironment 取值（优先级高于 yml），corpid/app-key 被覆盖为 null
    - corpid: ww0ae0c799548c75bd
      app-key: self-built
      secret: ${WECOM_SELF_BUILT_SECRET:}
    # 泰禾 — 通讯录（读取成员姓名等）；secret 经 WECOM_ADDRESS_BOOK_SECRET 注入
    - corpid: ww0ae0c799548c75bd
      app-key: address-book
      secret: ${WECOM_ADDRESS_BOOK_SECRET:}
  # 群机器人 Webhook 告警（测试环境按需开启；key 经 WECOM_WEBHOOK_KEY 注入，勿提交版本库）
  webhook:
    enabled: true
    key: ${WECOM_WEBHOOK_KEY:}
    mention-mobiles: [ ]
    alert-interval-seconds: 1800

# ---------- 勤策 CRM OpenAPI ----------
# app-key 经环境变量 CRM_APP_KEY 注入
crm:
  base-url: https://crm.cacch.com:50001
  open-id: "8858965636174056137"
  app-key: ${CRM_APP_KEY:}
  employee-base-url: https://crm.cacch.com:50001
  collect:
    cron: "0 */5 * * * ?"
    batch-size: 100
    detail-page-size: 100
    detail-retry-batch-size: 100
  sync:
    cron: "0 */5 * * * ?"
    batch-size: 100
    max-retry: 3

# ---------- 致远 OA REST ----------
# 部署前请替换为真实 OA 地址与 REST 账号；密码经 OA_REST_PASSWORD 注入
oa:
  base-url: http://10.80.64.18:900
  rest-user-name: zhouhufu
  rest-password: ${OA_REST_PASSWORD:}
  default-login-name: zhouhongfu
  token-ttl-seconds: 840
  template-code: CRM_ZYXS_001
  # OA Oracle 只读库（勿写入 spring.datasource，Flyway 仅迁移 PG 集成库）；密码经 OA_DB_PASSWORD 注入
  datasource:
    url: jdbc:oracle:thin:@//10.80.64.19:1521/seeyon
    username: V5
    password: ${OA_DB_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
  attachment-sync:
    # 测试阶段仅联调李庆辉负责的资料
    owner-name-filter:

# ---------- 共享盘 SMB（与 Windows 访问 \\192.168.1.8\国内登记资料 的域账号一致；密码经 SHARE_DRIVE_PASSWORD 注入） ----------
share-drive:
  username: liuyanmiao
  password: ${SHARE_DRIVE_PASSWORD:}
  domain: ""

# ---------- 法大大实名认证 ----------
# app-secret 经环境变量 FDD_APP_SECRET 注入
fdd:
  base-url: http://10.80.61.82
  auth-url: http://10.80.61.82/base/login/oauth2/accessToken
  app-id: "268282"
  app-secret: ${FDD_APP_SECRET:}
  enterprise-auth-url: http://10.80.61.82/user/api/verify/company/url
  person-auth-url: http://10.80.61.82/user/api/verify/person/url
  connect-timeout-seconds: 10
  read-timeout-seconds: 30
  # 具体地址联调前按测试部署环境补充
  callback-url: http://10.80.86.94/gw_cip_test/v1/fdd/callback
  callback-timeout-minutes: 3
  # 仅测试环境：允许 POST /api/v1/fdd/callback/test/enterprise 回放历史企业回调
  callback-test-enabled: true
  token-cache-minutes: 25
  enterprise-verified-way: 0
  person-verified-way: 0
  max-retry: 3
  internal-companies:
    - 南通泰禾化工股份有限公司
    - 上海泰禾国际贸易有限公司

# ---------- 腾讯会议 REST API（智能纪要） ----------
# secret-id / secret-key 分别经 TENCENT_MEETING_SECRET_ID / TENCENT_MEETING_SECRET_KEY 注入
tencent-meeting:
  enabled: true
  app-id: "311670505"
  sdk-id: "32470112674"
  secret-id: ${TENCENT_MEETING_SECRET_ID:}
  secret-key: ${TENCENT_MEETING_SECRET_KEY:}
  operator-id-type: 1
  smart-minutes:
    text-type: 2
    llm: 1
    minute-type: 1
    lang: default

# ---------- Actuator 健康监控 ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info
