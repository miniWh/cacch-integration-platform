# ==================== 生产环境配置 ====================
# 安全要求：密码、密钥等敏感信息严禁在此文件中明文写入，严禁保留明文默认值。
# 全部通过环境变量注入；未设置对应环境变量时应用启动即失败（fail-fast），
# 部署前请按 docs/security/env-variables.md 完成环境变量配置。
#
# 角色：all = HTTP 接口 + 定时任务（本进程同时承担调度，勿再在测试环境开调度）

app:
  role: all

spring:
  # ---------- PostgreSQL 数据源 ----------
  datasource:
    # 地址经 DB_URL 注入；用户名/密码分别经 DB_USERNAME / DB_PASSWORD 注入
    url: ${DB_URL:jdbc:postgresql://10.80.86.93:5432/cdb}
    username: ${DB_USERNAME:esb}
    # 数据库密码，必须由环境变量注入（缺失即启动失败）
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # ---------- Redis 配置 ----------
  data:
    redis:
      # 生产 Redis 地址通过环境变量 REDIS_HOST 注入
      host: ${REDIS_HOST:10.80.86.95}
      # Redis 端口
      port: 6379
      # Redis 密码，必须由环境变量 REDIS_PASSWORD 注入（缺失即启动失败）
      password: ${REDIS_PASSWORD}
      lettuce:
        pool:
          # 最大活跃连接数（生产环境适当放大）
          max-active: 16
          # 最大空闲连接数（减少频繁创建/销毁开销）
          max-idle: 16
          # 最小空闲连接数（预创建 4 个，应对突发流量）
          min-idle: 4

  # ---------- Flyway：生产环境禁止自动迁移（与 test 共用库，迁移仅由 test profile 执行） ----------
  flyway:
    enabled: false

# ---------- 服务端口 ----------
server:
  port: 8080

# ---------- Actuator 健康监控 ----------
# ---------- 企业微信多应用配置 ----------
# 生产环境 List 无法整体用 ${ENV} 注入，secret 使用索引占位符逐项注入：
#   export WECOM_APPS_0_CORPID=wwxxx WECOM_APPS_0_SECRET=xxx
#   export WECOM_APPS_1_CORPID=wwxxx WECOM_APPS_1_SECRET=xxx
# corpid 可保留默认（半敏感标识），secret 必须由环境变量注入（缺失时对应应用鉴权不可用）
wecom:
  apps:
    # 泰禾 — 自建应用（智能表格等文档 API 使用此配置鉴权）
    - corpid: ww0ae0c799548c75bd
      app-key: self-built
      secret: ${WECOM_APPS_0_SECRET:}
    # 泰禾 — 通讯录（读取成员姓名等）
    - corpid: ww0ae0c799548c75bd
      app-key: address-book
      secret: ${WECOM_APPS_1_SECRET:}
  # 群机器人 Webhook — 目录治理/附件同步异常告警（key 经 WECOM_WEBHOOK_KEY 注入）
  webhook:
    enabled: true
    key: ${WECOM_WEBHOOK_KEY:}

# ---------- 勤策 CRM OpenAPI ----------
# app-key 必须由环境变量 CRM_APP_KEY 注入（缺失即启动失败）
crm:
  base-url: ${CRM_BASE_URL:https://crm.cacch.com:50001}
  open-id: ${CRM_OPEN_ID:8858965636174056137}
  app-key: ${CRM_APP_KEY}
  employee-base-url: ${CRM_EMPLOYEE_BASE_URL:https://crm.cacch.com:50001}
  collect:
    cron: "0 */5 * * * ?"
    batch-size: 100
    detail-page-size: 100
    detail-retry-batch-size: 100
  sync:
    cron: "0 */5 * * * ?"
    batch-size: 100
    max-retry: 3

# ---------- 致远 OA REST ----------
# 密钥由环境变量注入：OA_BASE_URL / OA_REST_USER_NAME / OA_REST_PASSWORD；
# rest-password 必须设置（缺失即启动失败）
oa:
  base-url: ${OA_BASE_URL:http://10.80.64.18:900}
  rest-user-name: ${OA_REST_USER_NAME:zhouhufu}
  rest-password: ${OA_REST_PASSWORD}
  default-login-name: ${OA_DEFAULT_LOGIN_NAME:zhouhongfu}
  token-ttl-seconds: ${OA_TOKEN_TTL_SECONDS:840}
  template-code: ${OA_TEMPLATE_CODE:CRM_ZYXS_001}
  # OA Oracle 只读库（独立第二数据源，勿覆盖 spring.datasource）；密码经 OA_DB_PASSWORD 注入（缺失即启动失败）
  datasource:
    url: ${OA_DB_URL:jdbc:oracle:thin:@//10.80.64.19:1521/seeyon}
    username: ${OA_DB_USERNAME:V5}
    password: ${OA_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  # REQ-OA-001 登记报告附件同步（正式环境开启定时任务）
  attachment-sync:
    enabled: true
    # cron 继承 application.yml：每 4 小时（0/4/8/12/16/20 点）
    owner-name-filter: ""
  # REQ-OA-002 共享盘目录治理（正式环境开启定时任务）
  share-dir-provision:
    enabled: true
    # cron 继承 application.yml：每小时整点执行
    owner-allowlist: []
    alert-not-empty-skipped: true

# ---------- 共享盘 SMB（与 Windows 访问 \\192.168.1.8\国内登记资料 的域账号一致；密码经 SHARE_DRIVE_PASSWORD 注入，缺失即启动失败） ----------
share-drive:
  username: liuyanmiao
  password: ${SHARE_DRIVE_PASSWORD}
  domain: ""

# ---------- 法大大实名认证 ----------
# app-secret 必须由环境变量 FDD_APP_SECRET 注入（缺失即启动失败）
fdd:
  base-url: http://10.80.61.92
  auth-url: http://10.80.61.92/base/login/oauth2/accessToken
  app-id: "345011"
  app-secret: ${FDD_APP_SECRET}
  enterprise-auth-url: http://10.80.61.92/user/api/verify/company/url
  person-auth-url: http://10.80.61.92/user/api/verify/person/url
  connect-timeout-seconds: 10
  read-timeout-seconds: 30
  # 具体地址上线前按生产部署环境补充
  callback-url: http://10.80.86.94/gw_cip/v1/fdd/callback
  callback-timeout-minutes: 3
  token-cache-minutes: 25
  enterprise-verified-way: 0
  person-verified-way: 0
  max-retry: 3
  internal-companies:
    - 南通泰禾化工股份有限公司
    - 上海泰禾国际贸易有限公司

# ---------- 腾讯会议 REST API（智能纪要） ----------
# 未配置时会继承 application.yml 的 enabled=false，导致正式环境跳过纪要拉取。
# secret-id / secret-key 必须分别由 TENCENT_MEETING_SECRET_ID / TENCENT_MEETING_SECRET_KEY 注入（缺失即启动失败）
tencent-meeting:
  enabled: ${TENCENT_MEETING_ENABLED:true}
  app-id: ${TENCENT_MEETING_APP_ID:311670505}
  sdk-id: ${TENCENT_MEETING_SDK_ID:32470112674}
  secret-id: ${TENCENT_MEETING_SECRET_ID}
  secret-key: ${TENCENT_MEETING_SECRET_KEY}
  operator-id-type: 1
  default-operator-id: ${TENCENT_MEETING_DEFAULT_OPERATOR_ID:}
  smart-minutes:
    text-type: 2
    llm: 1
    minute-type: 1
    lang: default

# ---------- Actuator 健康监控 ----------
management:
  endpoints:
    web:
      exposure:
        # 生产环境额外暴露 metrics 用于 Prometheus 等监控系统采集
        include: health,info,metrics
